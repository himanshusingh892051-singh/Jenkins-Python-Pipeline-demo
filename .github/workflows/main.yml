name: variable demo workflow
on:
    push:
        branches: 
        - master
    
    workflow_dispatch:
env:
            PYTHON_VERSION: 3.9
jobs:
    buildpythoncode:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: Set up python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v6
              with:
                python-version: ${{ env.PYTHON_VERSION }}
            - name: Print python version
              run: python --version
    buildcode-python:
        env:
            PYTHON_VERSION_JOB: 3.11
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: Set up python ${{ env.PYTHON_VERSION_JOB }}
              uses: actions/setup-python@v6
              with:
                python-version: ${{ env.PYTHON_VERSION_JOB }}
    buildcode-python-step:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: Set up python 
              env:
                PYTHON_VERSION_STEP: 3.12
              uses: actions/setup-python@v6
              with:
                python-version: ${{ env.PYTHON_VERSION_STEP }}
            - name: Print python version
              run: python --version
